version: 1
backend:
  phases:
    preBuild:
      commands:
        # Pin to Node 20 LTS — .nvmrc also set to 20 as a belt-and-suspenders guard
        - nvm install 20
        - nvm use 20
        - node --version
        - npm --version
        # Wipe any cached state from previous failed builds
        - rm -rf node_modules package-lock.json
        - npm cache clean --force
        # Install with legacy peer deps to handle CDK peer resolution
        - npm install --legacy-peer-deps
    build:
      commands:
        - node --version
        - npx ampx pipeline-deploy --branch main --app-id d1pmiq0zt0m85e
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node --version
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

version: 1
backend:
  phases:
    preBuild:
      commands:
        # 1. Force wipe the corrupted cache and lockfiles
        - npm cache clean --force
        - rm -rf node_modules package-lock.json .npm
        # 2. Re-align the backend compiler dependencies
        - npm install --save-dev @aws-amplify/backend @aws-amplify/backend-cli aws-cdk aws-cdk-lib
        - npm install
    build:
      commands:
        - npx ampx pipeline-deploy --branch main --app-id d1pmiq0zt0m85e
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'